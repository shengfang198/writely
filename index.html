<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notepad</title>
<link rel="icon" type="image/png" href="assets/favicon-ve.png">
<style>
  :root {
    --bg: #faf8f4;
    --panel: #ffffff;
    --border: #e5e0d8;
    --text: #2b2925;
    --muted: #8a8478;
    --accent: #c9622a;
    --accent-soft: #f3e4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
  }
  #sidebar {
    width: 260px;
    min-width: 200px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  #sidebar-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sidebar-header h2 {
    font-size: 15px;
    margin: 0;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  #new-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    width: 26px;
    height: 26px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }
  #new-btn:hover { opacity: 0.85; }
  #search-box {
    margin: 10px 12px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  #search-box:focus { border-color: var(--accent); }
  #note-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
  }
  .note-item {
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.12s;
  }
  .note-item:hover { background: var(--accent-soft); }
  .note-item.active { background: var(--accent-soft); }
  .note-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-title:hover { text-decoration: underline; }
  .note-preview {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .note-date {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
    margin-top: 3px;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 40px;
    overflow-y: auto;
  }
  #title-input {
    font-size: 26px;
    font-weight: 700;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    margin-bottom: 10px;
  }
  #title-input::placeholder { color: var(--muted); font-weight: 600; }
  #meta-row {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  #delete-btn, #export-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  #delete-btn:hover { border-color: #c0392b; color: #c0392b; }
  #export-btn:hover { border-color: var(--accent); color: var(--accent); }
  #body-input {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    font-family: inherit;
  }
  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
  }
  #status {
    position: fixed;
    bottom: 14px;
    right: 20px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.3s;
  }
  #status.show { opacity: 1; }
  #status.error { color: #c0392b; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>Notes</h2>
    <button id="new-btn" title="New note">+</button>
  </div>
  <input id="search-box" type="text" placeholder="Search notes...">
  <div id="note-list"></div>
</div>

<div id="main">
  <div id="empty-state">
    <p>Select a note on the left, or click + to start a new one.</p>
  </div>
</div>

<div id="status">Saved</div>

<script>
const STORAGE_KEY = 'notepad-notes-v1';
let notes = {};
let activeId = null;

const noteListEl = document.getElementById('note-list');
const mainEl = document.getElementById('main');
const searchBox = document.getElementById('search-box');
const statusEl = document.getElementById('status');

function uid() {
  return 'n' + Date.now() + Math.random().toString(36).slice(2, 8);
}

function showStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'show error' : 'show';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 1500);
}

function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : {};
  } catch (e) {
    notes = {};
  }
}

function persistNotes() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    showStatus('Saved');
  } catch (e) {
    showStatus('Storage full — could not save', true);
    console.error(e);
  }
}

function renderList() {
  const query = searchBox.value.trim().toLowerCase();
  const items = Object.values(notes)
    .filter(n => {
      if (!query) return true;
      return (n.title || '').toLowerCase().includes(query) ||
             (n.body || '').toLowerCase().includes(query);
    })
    .sort((a, b) => (b.updated || 0) - (a.updated || 0));

  noteListEl.innerHTML = '';
  items.forEach(note => {
    const div = document.createElement('div');
    div.className = 'note-item' + (note.id === activeId ? ' active' : '');

    const titleEl = document.createElement('a');
    titleEl.className = 'note-title';
    titleEl.href = '#note-' + note.id;
    titleEl.textContent = note.title || 'Untitled';
    titleEl.onclick = (e) => {
      e.preventDefault();
      openNote(note.id);
    };

    const previewEl = document.createElement('div');
    previewEl.className = 'note-preview';
    previewEl.textContent = (note.body || '').slice(0, 60) || 'No content';

    const dateEl = document.createElement('div');
    dateEl.className = 'note-date';
    dateEl.textContent = note.updated ? new Date(note.updated).toLocaleString() : '';

    div.appendChild(titleEl);
    div.appendChild(previewEl);
    div.appendChild(dateEl);
    div.onclick = () => openNote(note.id);
    noteListEl.appendChild(div);
  });
}

function openNote(id) {
  activeId = id;
  window.location.hash = 'note-' + id;
  renderList();
  renderMain();
}

function downloadNote(note) {
  const blob = new Blob([note.body || ''], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (note.title || 'untitled').replace(/[^a-z0-9\-_ ]/gi, '_') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function renderMain() {
  const note = notes[activeId];
  if (!note) {
    mainEl.innerHTML = '<div id="empty-state"><p>Select a note on the left, or click + to start a new one.</p></div>';
    return;
  }
  mainEl.innerHTML = `
    <input id="title-input" placeholder="Untitled" value="${escapeAttr(note.title || '')}">
    <div id="meta-row">
      <span id="last-edited">Last edited ${note.updated ? new Date(note.updated).toLocaleString() : 'just now'}</span>
      <button id="export-btn">Export .txt</button>
      <button id="delete-btn">Delete</button>
    </div>
    <textarea id="body-input" placeholder="Start typing...">${escapeHtml(note.body || '')}</textarea>
  `;

  const titleInput = document.getElementById('title-input');
  const bodyInput = document.getElementById('body-input');
  const deleteBtn = document.getElementById('delete-btn');
  const exportBtn = document.getElementById('export-btn');

  titleInput.addEventListener('input', () => {
    note.title = titleInput.value;
    note.updated = Date.now();
    renderList();
    persistNotes();
  });

  bodyInput.addEventListener('input', () => {
    note.body = bodyInput.value;
    note.updated = Date.now();
    persistNotes();
    document.getElementById('last-edited').textContent =
      'Last edited ' + new Date(note.updated).toLocaleString();
  });

  deleteBtn.addEventListener('click', () => {
    if (confirm('Delete this note?')) {
      delete notes[activeId];
      activeId = null;
      window.location.hash = '';
      renderList();
      renderMain();
      persistNotes();
    }
  });

  exportBtn.addEventListener('click', () => downloadNote(note));

  titleInput.focus();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/"/g, '&quot;');
}

document.getElementById('new-btn').addEventListener('click', () => {
  const id = uid();
  notes[id] = { id, title: '', body: '', updated: Date.now() };
  activeId = id;
  window.location.hash = 'note-' + id;
  renderList();
  renderMain();
  persistNotes();
});

searchBox.addEventListener('input', renderList);

window.addEventListener('hashchange', () => {
  const match = window.location.hash.match(/^#note-(.+)$/);
  if (match && notes[match[1]]) {
    activeId = match[1];
    renderList();
    renderMain();
  }
});

loadNotes();
const match = window.location.hash.match(/^#note-(.+)$/);
if (match && notes[match[1]]) {
  activeId = match[1];
}
renderList();
renderMain();
</script>

</body>
</html>
